<html lang="en">
    <head>    
        <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
        <link rel="stylesheet" href="app.css">
        <script src="https://js-cdn.music.apple.com/musickit/v3/musickit.js"></script>
        <script type="module" src="app.js"></script>

    </head>

    <body>
        <div id="rotateWarning">
            Welcome to the Radford ListeningMap. Rotate your device to get the best experience. 
        </div>

    <div id="playbackGrid">
            <div id="pbContainer">
                <div id="identifiers">
                    <h1 id="composer"></h1>
                    <a id="trackName"></a>
                </div>
                <div id="sections"></div>
                <div id="keyBar"></div>
                <div id="notes"></div>  

            </div>
            <div id="bottom">
                <div id="controls">
                    <button id="playButton" type="button" disabled><span class="material-icons" id="playBtn" style="cursor: pointer;">play_arrow</span></button>
                    <div id="clickTrack" style="cursor: pointer;">
                        <div id="track">
                            <div id="progress"></div>
                            <div id="slider" style="cursor: pointer;"></div>
                        </div>
                    </div>
                </div>
                <div id="timers">
                        <div id="pbTime">0:00</div> 
                        <div id="duration">0:00</div>
                </div>
            </div>
            
        </div>
    </body>
</html>
